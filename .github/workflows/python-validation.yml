name: MediaNest Python validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app import dependencies
        run: python -m pip install "fastapi>=0.115,<1.0" "httpx>=0.27,<1.0" "itsdangerous>=2.2,<3.0" "python-multipart>=0.0.20,<1.0"
      - name: Compile Python modules
        run: python -m py_compile app.py telegram_bot.py
      - name: Import app and validate Telegram routes
        run: |
          python - <<'PY'
          import app
          paths = {route.path for route in app.app.routes}
          assert "/telegram/webhook" in paths, "Telegram webhook route missing"
          assert "/telegram/download/{download_token}" in paths, "Temporary download route missing"
          assert "/api/image-download" in paths, "Existing image route missing"
          assert "/api/download" in paths, "Existing video route missing"
          print("Import and route checks passed.")
          PY
