name: MediaNest Python validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app import dependencies
        run: python -m pip install "fastapi>=0.115,<1.0" "httpx>=0.27,<1.0" "itsdangerous>=2.2,<3.0" "python-multipart>=0.0.20,<1.0" "pytest>=8,<10"
      - name: Compile Python modules
        run: python -m py_compile app.py telegram_bot.py
      - name: Run shared job history tests
        run: python -m pytest -q
      - name: Validate website JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("static/index.html").read_text(encoding="utf-8")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/medianest-inline.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/medianest-inline.js
      - name: Import app and validate routes
        run: |
          python - <<'PY'
          import app

          def collect_paths(routes):
              paths = set()
              for route in routes:
                  path = getattr(route, "path", None)
                  if path:
                      paths.add(path)
                  nested_router = getattr(route, "router", None)
                  if nested_router is not None and hasattr(nested_router, "routes"):
                      paths.update(collect_paths(nested_router.routes))
              return paths

          paths = collect_paths(app.app.routes)
          paths.update(collect_paths(app.telegram_router.routes))
          assert "/telegram/webhook" in paths, "Telegram webhook route missing"
          assert "/telegram/download/{download_token}" in paths, "Temporary download route missing"
          assert "/api/image-download" in paths, "Existing image route missing"
          assert "/api/download" in paths, "Existing video route missing"
          print("Import and route checks passed.")
          PY
