services:
  - type: web
    name: clipnest-personal-video-tool
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    domains:
      - medianest.reelsbytanjim.com
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: MAX_DOWNLOAD_MB
        value: "400"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
